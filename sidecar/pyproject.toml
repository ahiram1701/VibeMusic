[project]
name = "vibemusic-sidecar"
version = "0.1.0"
description = "Motor local de generación de audio para VibeMusic (MusicGen)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "numpy>=1.26"]

[project.optional-dependencies]
# Pesado (torch + modelos). CI no lo instala. La app lo instala con requirements-models.txt.
models = ["torch>=2.6", "transformers>=4.45"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Módulos sueltos (sin paquete): el servidor y los motores de generación.
py-modules = ["server", "engine"]
