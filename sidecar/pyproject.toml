[project]
name = "vibemusic-sidecar"
version = "0.1.0"
description = "Motor local de generación de audio para VibeMusic (MusicGen / Stable Audio Open / Demucs)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
# Pesado (torch + modelos): solo en máquinas con GPU. CI no lo instala.
models = ["audiocraft>=1.3", "demucs>=4.0"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
