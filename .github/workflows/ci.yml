name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Pruebas de la app real (Electron). En Windows hay escritorio y audio disponibles.
      - name: E2E (Playwright + Electron)
        if: runner.os == 'Windows'
        run: npx playwright test
      # El instalador se construye y se prueba ya empaquetado en cada PR, para que
      # el tag de una versión no descubra problemas de empaquetado.
      - name: Empaquetar y probar la app instalable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --publish never
          export VIBE_PACKAGED_APP="release/$(node -p "require('./package.json').version")/win-unpacked/VibeMusic.exe"
          npx playwright test packaged
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: e2e-results
          path: test-results/

  sidecar:
    name: Sidecar (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
