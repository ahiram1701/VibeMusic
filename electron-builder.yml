appId: com.vibemusic.app
productName: VibeMusic
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - '**/*'
      - '!.venv/**'
      - '!tests/**'
      - '!**/__pycache__/**'
      - '!*.egg-info/**'
      - '!.pytest_cache/**'
      - '!.ruff_cache/**'
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
publish:
  provider: github
  releaseType: draft
