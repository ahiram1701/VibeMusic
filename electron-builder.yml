appId: com.vibemusic.app
productName: VibeMusic
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: sidecar
    to: sidecar
    filter: ['**/*', '!**/__pycache__', '!.venv', '!tests']
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
publish:
  provider: github
  releaseType: draft
