appId: com.vibemusic.app
productName: VibeMusic
copyright: Copyright © 2026 Alberto Hiram Saucedo Guajardo
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - '**/*'
      - '!.venv/**'
      - '!tests/**'
      - '!**/__pycache__/**'
      - '!*.egg-info/**'
      - '!.pytest_cache/**'
      - '!.ruff_cache/**'
icon: build/icon.png
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  # Instalación por usuario (sin pedir administrador) en %LOCALAPPDATA%\Programs.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VibeMusic
  license: LICENSE
mac:
  target: dmg
linux:
  target: AppImage
publish:
  provider: github
  releaseType: draft
